# Configuração do Kamal 2 — destino PRODUÇÃO (base).
# Overrides de staging em config/deploy.staging.yml (usado com `kamal deploy -d staging`).
#
# Arquitetura: o Caddy nativo da VPS é o proxy reverso de borda (TLS + roteamento por host).
# Por isso `proxy: false` — o Kamal só publica o container em 127.0.0.1:3000 e o Caddy
# encaminha `elcitadino.railson.click` para lá. Ver deploy/README.md.

service: elcitadino
image: railsonrames/elcitadino

servers:
  web:
    hosts:
      - 51.195.220.76
    # Caddy é o proxy de borda; não subir o kamal-proxy (ele brigaria pelas portas 80/443).
    proxy: false
    options:
      publish:
        - "127.0.0.1:3000:80"   # Thruster escuta na 80 dentro do container

# Espera o container ficar healthy (HEALTHCHECK no Dockerfile) antes de derrubar o antigo.
readiness_delay: 10

registry:
  server: ghcr.io
  username: railsonrames
  password:
    - KAMAL_REGISTRY_PASSWORD

# Usuário dedicado ao Kamal na VPS (membro do grupo docker). Criado por deploy/provision-vps.sh.
ssh:
  user: kamal

builder:
  arch: amd64

# Variáveis injetadas no container. Segredos vêm de .kamal/secrets-common.
env:
  clear:
    # Roda o supervisor do Solid Queue dentro do Puma (inclui as tarefas de config/recurring.yml).
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 1
    WEB_CONCURRENCY: 2
    # Host do Postgres na rede interna do Kamal (nome do container accessory abaixo).
    DB_HOST: elcitadino-db
    RAILS_LOG_TO_STDOUT: "1"
  secret:
    - RAILS_MASTER_KEY
    - ELCITADINO_DATABASE_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"

# Active Storage usa Cloudinary (config/storage.yml); este volume guarda só o cache local
# de disco eventual. Mantido por segurança.
volumes:
  - "elcitadino_storage:/rails/storage"

asset_path: /rails/public/assets

# Postgres gerido pelo próprio Kamal. Dados num bind-mount do host para facilitar
# backup (deploy/pg-backup.sh) e migração de VPS.
accessories:
  db:
    image: postgres:17-alpine
    host: 51.195.220.76
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: elcitadino
        POSTGRES_DB: elcitadino_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /opt/elcitadino/postgres/production:/var/lib/postgresql/data
