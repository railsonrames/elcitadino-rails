# scheduled_at is deliberately far out (15/17 days, not "3 days") and at a
# fixed hour — tests all over the suite compute their own dates via
# Date.tomorrow.next_occurring(:some_weekday), which always lands within a
# week of tomorrow. A closer fixture date can coincidentally land on the
# exact same day (and even the same hour, since both use round numbers),
# tripping the no_overlapping_appointments validation depending on what
# day the suite happens to run. Staying well past that one-week window
# avoids the whole class of flakiness regardless of today's date.
one:
  client: client_one
  provider_profile: one
  service: one
  scheduled_at: <%= 15.days.from_now.change(hour: 10, min: 0, sec: 0) %>
  status: 0
  modality: 0
  notes: Primeira vez no salão.

two:
  client: client_two
  provider_profile: two
  service: two
  scheduled_at: <%= 17.days.from_now.change(hour: 11, min: 0, sec: 0) %>
  status: 0
  modality: 0
  notes: Cliente recorrente.
