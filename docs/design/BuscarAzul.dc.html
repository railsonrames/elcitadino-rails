<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"></helmet>
<div style="{{ sBody }}">
  <div style="{{ sHeader }}">
    <div style="{{ sStatus }}"><span>9:41</span><span style="display:flex;gap:3px;align-items:center"><span style="{{ sBar1 }}"></span><span style="{{ sBar2 }}"></span><span style="{{ sBar3 }}"></span></span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:4px 16px 0">
      <div style="{{ sMascot }}">DINO</div>
      <div>
        <div style="font:800 19px/1 Archivo,sans-serif;letter-spacing:-.02em">ElCitaDino</div>
        <div style="{{ sTagline }}">Tu tiempo, bien invertido.</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div style="position:relative;display:flex">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span style="{{ sBadge }}">2</span>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </div>
    </div>
    <h1 style="{{ sH1 }}">¿Qué servicio necesitas?</h1>
    <div style="display:flex;gap:8px;padding:0 16px">
      <div style="{{ sSearch }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ sSearchIcon }}"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <span style="{{ sPlaceholder }}">Ej. Manicura, masaje, clases de inglés…</span>
      </div>
      <button type="button" style="{{ sFilter }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>
    <div style="{{ sChipRow }}">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <span style="{{ c.style }}">{{ c.label }}</span>
      </sc-for>
    </div>
  </div>
  <div style="{{ sSheet }}">
    <div style="display:flex;align-items:center;gap:6px;padding:0 0 12px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ sPin }}"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span style="font:700 12px Archivo,sans-serif">Resultados cerca de ti</span>
      <span style="{{ sLink }}">Cambiar ubicación</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ providers }}" as="p" hint-placeholder-count="4">
        <div style="{{ p.cardStyle }}">
          <div style="{{ p.photoStyle }}">FOTO</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:flex-start;gap:8px">
              <div style="min-width:0;flex:1">
                <sc-if value="{{ p.top }}" hint-placeholder-val="{{ false }}"><span style="{{ sTopTag }}">Top valorado</span></sc-if>
                <div style="font:800 15px/1.2 Archivo,sans-serif;letter-spacing:-.01em">{{ p.name }}</div>
                <div style="{{ sMeta }}">{{ p.category }}</div>
              </div>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ sHeart }}"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"></path></svg>
            </div>
            <div style="display:flex;align-items:center;gap:5px;margin-top:6px;font:700 12px Archivo,sans-serif">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="{{ sStar }}"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"></path></svg>
              <span>{{ p.rating }}</span>
              <span style="{{ sMetaInline }}">({{ p.reviews }}) · {{ p.km }}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;row-gap:6px;margin-top:9px">
              <span style="{{ sAvail }}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
                {{ p.avail }}
              </span>
              <button type="button" style="{{ sBtn }}">Ver horarios</button>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="{{ sTabs }}">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <div style="{{ t.style }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.icon }}"></path></svg>
        <span style="font:700 10px Archivo,sans-serif;margin-top:4px">{{ t.label }}</span>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:840},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;band&quot;,&quot;hero&quot;,&quot;tinted&quot;],&quot;default&quot;:&quot;band&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1653d9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deep&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0e3aa3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent2&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1aa64b&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ICONS = {
  search: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm10 17-4.3-4.3",
  calendar: "M7 3v3M17 3v3M4 8h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z",
  chat: "M21 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2Z",
  user: "M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 10a8 8 0 0 0-16 0"
};

const DATA = [
  { name: "Peluquería Marisol", category: "Belleza · Alicante", rating: "4,8", reviews: "120", km: "1,2 km", avail: "Disponible hoy", top: true },
  { name: "Centro Zen Alicante", category: "Bienestar · Alicante", rating: "4,9", reviews: "86", km: "1,6 km", avail: "Disponible hoy", top: false },
  { name: "Box Cronos", category: "Fitness · Elche", rating: "4,7", reviews: "72", km: "2,3 km", avail: "Disponible mañana", top: false },
  { name: "Academia Sáez", category: "Educación · Alicante", rating: "5,0", reviews: "54", km: "2,1 km", avail: "Disponible hoy", top: false }
];

class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? "band";
    const blue = this.props.accent ?? "#1653d9";
    const deep = this.props.deep ?? "#0e3aa3";
    const green = this.props.accent2 ?? "#1aa64b";
    const ink = "#101a2e", muted = "#5b6b85", line = "#dbe4f3";
    const ground = mode === "tinted" ? "#eaf0fb" : "#f2f6fd";
    const r = 14, rs = 10;

    const hero = mode === "hero";
    const headerBg = hero ? deep : blue;
    const onBlue = "#ffffff";
    const sheetTop = hero ? -22 : -18;

    const cardFills = mode === "tinted"
      ? ["#ffffff", "#e7eeff", "#ffffff", "#e7f4ec"]
      : ["#ffffff", "#ffffff", "#ffffff", "#ffffff"];

    return {
      sBody: `width:390px;background:${ground};color:${ink};font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5`,
      sHeader: `background:${headerBg};color:${onBlue};padding-bottom:${hero ? 30 : 22}px`,
      sStatus: `display:flex;align-items:center;justify-content:space-between;padding:9px 16px;font:700 12px Archivo,sans-serif;color:rgba(255,255,255,.85)`,
      sBar1: "width:5px;height:9px;background:#fff;display:block;border-radius:2px",
      sBar2: "width:5px;height:9px;background:#fff;display:block;border-radius:2px",
      sBar3: "width:5px;height:9px;background:rgba(255,255,255,.45);display:block;border-radius:2px",
      sMascot: `width:44px;height:44px;flex:none;border-radius:${rs}px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 6px,rgba(255,255,255,.12) 6px 12px);border:1px solid rgba(255,255,255,.5);display:flex;align-items:flex-end;justify-content:center;font:600 7px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.9);padding-bottom:3px`,
      sTagline: "font:400 11px Archivo,sans-serif;color:rgba(255,255,255,.78);margin-top:2px",
      sBadge: `position:absolute;top:-4px;right:-5px;min-width:15px;height:15px;border-radius:999px;background:${green};color:#fff;font:800 9px/15px Archivo,sans-serif;text-align:center`,
      sH1: hero
        ? "font:800 26px/1.15 Archivo,sans-serif;letter-spacing:-.02em;margin:18px 16px 14px;color:#fff"
        : "font:800 18px/1.2 Archivo,sans-serif;letter-spacing:-.02em;margin:14px 16px 10px;color:#fff",
      sSearch: `flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:${r}px;padding:12px 14px`,
      sSearchIcon: `color:${blue};flex:none`,
      sPlaceholder: `font:400 13px Archivo,sans-serif;color:${muted};white-space:nowrap;overflow:hidden;text-overflow:ellipsis`,
      sFilter: `flex:none;width:46px;border:1px solid rgba(255,255,255,.55);border-radius:${r}px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer`,
      sChipRow: "display:flex;gap:8px;padding:12px 16px 0;overflow:hidden",
      chips: ["Todos", "Belleza", "Bienestar", "Fitness", "Hogar"].map((label, i) => ({
        label,
        style: i === 0
          ? `flex:none;padding:7px 13px;border-radius:999px;background:${green};color:#fff;font:800 12px Archivo,sans-serif`
          : "flex:none;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;font:600 12px Archivo,sans-serif"
      })),
      sSheet: `background:${ground};border-radius:22px 22px 0 0;margin-top:${sheetTop}px;position:relative;padding:16px 16px 18px`,
      sPin: `color:${green};flex:none`,
      sLink: `margin-left:auto;font:700 12px Archivo,sans-serif;color:${blue}`,
      sMeta: `font:400 12px Archivo,sans-serif;color:${muted};margin-top:2px`,
      sMetaInline: `font:400 12px Archivo,sans-serif;color:${muted}`,
      sHeart: `color:${muted};flex:none`,
      sStar: "color:#f5a524;flex:none",
      sTopTag: `display:inline-block;margin-bottom:4px;padding:2px 7px;border-radius:999px;background:${green};color:#fff;font:800 9px Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase`,
      sAvail: `display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:${mode === "tinted" ? "#fff" : "#e7f4ec"};font:700 11px Archivo,sans-serif;color:${green};white-space:nowrap`,
      sBtn: `flex:none;border:0;border-radius:999px;background:${blue};color:#fff;font:800 12px Archivo,sans-serif;padding:8px 14px;cursor:pointer`,
      sTabs: `display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid ${line};background:#fff;padding:9px 0 13px`,
      tabs: [
        { label: "Buscar", icon: ICONS.search, on: true },
        { label: "Mis citas", icon: ICONS.calendar, on: false },
        { label: "Mensajes", icon: ICONS.chat, on: false },
        { label: "Perfil", icon: ICONS.user, on: false }
      ].map(t => ({
        label: t.label, icon: t.icon,
        style: `display:flex;flex-direction:column;align-items:center;color:${t.on ? blue : muted}`
      })),
      providers: DATA.map((p, i) => ({
        ...p,
        cardStyle: `display:flex;gap:12px;background:${cardFills[i]};border:1px solid ${mode === "tinted" ? "transparent" : line};border-radius:${r}px;padding:10px`,
        photoStyle: `width:96px;height:96px;flex:none;border-radius:${rs}px;background:repeating-linear-gradient(45deg,${line} 0 7px,#f2f6fd 7px 14px);display:flex;align-items:flex-end;padding:4px;font:600 7px ui-monospace,Menlo,monospace;color:${muted}`
      }))
    };
  }
}

</script>
</body>
</html>
